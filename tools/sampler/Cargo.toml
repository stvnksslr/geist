[package]
name = "sampler"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate, deliberately not a member of geist's build: it is a
# developer tool, and keeping it out means geist's dependency graph and build
# times never see dbghelp. See docs/benchmarking.md ("Sampling profiler").
[workspace]

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
