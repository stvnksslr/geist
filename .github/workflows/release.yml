name: Release

# Triggered by the Release that release-plz (.github/workflows/release-plz.yml)
# publishes after its version-bump PR merges. This job builds the Windows
# binaries and attaches them to that already-created Release.
on:
  release:
    types: [published]

permissions:
  contents: write # upload assets to the Release

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false # never cancel a release mid-upload

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    env:
      # `github.workspace` (not `runner.temp`): the `runner` context is not
      # available in job-level `env`, only inside steps. Outside target/ so
      # rust-cache won't prune it.
      GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/ghostty-src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The ghostty commit and the Zig version are pinned in the tree, not here:
      # a second copy in this file silently drifted out of sync once already and
      # cost a full Windows run to discover (the prefetched source was 876
      # commits behind the binding, so the build only failed at link time with
      # 37 unresolved ghostty_* externals). Read both from their one source of
      # truth instead. Later steps see these via the `env` context.
      - name: Resolve the pinned ghostty commit and Zig version
        shell: bash
        run: |
          set -euo pipefail
          commit=$(sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' \
            vendor/libghostty-rs/crates/libghostty-vt-sys/build.rs)
          zig=$(sed -n 's/^zig = "\([0-9][0-9.]*\)"$/\1/p' mise.toml)
          test -n "$commit" || { echo "::error::could not read GHOSTTY_COMMIT from build.rs"; exit 1; }
          test -n "$zig"    || { echo "::error::could not read the zig version from mise.toml"; exit 1; }
          echo "Ghostty $commit, Zig $zig"
          echo "GHOSTTY_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "ZIG_VERSION=$zig" >> "$GITHUB_ENV"

      # ARM64 cross-link needs the ARM64 MSVC toolchain environment on the x64 runner.
      - name: Set up ARM64 MSVC environment
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}

      - name: Cache ghostty source
        id: ghostty-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GHOSTTY_SOURCE_DIR }}
          key: ghostty-src-${{ env.GHOSTTY_COMMIT }}

      - name: Fetch ghostty source (cache miss)
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ghostty-org/ghostty.git "$GHOSTTY_SOURCE_DIR"
          git -C "$GHOSTTY_SOURCE_DIR" checkout "$GHOSTTY_COMMIT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: rel-${{ matrix.target }}-${{ env.GHOSTTY_COMMIT }}

      # package.ps1 is the one packager, so a CI release has exactly the shape
      # src/update.rs expects: geist-<v>-windows-<arch>.zip with one top-level
      # folder (exe + ConPTY + handoff proxy + licenses) and a
      # geist-manifest.json holding its SHA-256. The tag is passed as the
      # version: releases are tagged by hand, not by bumping Cargo.toml, and
      # package.ps1 hands it to build.rs (geist_VERSION) so the exe reports it.
      # No MSIX: it would ship unsigned, and Windows won't install that.
      - name: Build and package
        shell: pwsh
        run: >-
          ./scripts/package.ps1 -NoMsix
          -Version "${{ github.event.release.tag_name }}"
          -Target ${{ matrix.target }}

      # Each arch writes its own geist-manifest.json; rename so the release
      # job can merge them instead of one overwriting the other.
      - name: Stage artifacts
        shell: pwsh
        run: |
          $ver = "${{ github.event.release.tag_name }}".TrimStart('v')
          $arch = if ("${{ matrix.target }}" -like "aarch64-*") { "arm64" } else { "x64" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item "dist/$ver/*.zip" upload/
          Copy-Item "dist/$ver/geist-manifest.json" "upload/geist-manifest-$arch.json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: upload/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One geist-manifest.json listing every arch's zip: the updater reads a
      # single manifest per release and picks its own arch from `files`.
      - name: Merge manifests
        run: |
          set -euo pipefail
          jq -s '{version: .[0].version, channel: .[0].channel, files: (map(.files) | add)}' \
            dist/geist-manifest-*.json > dist/geist-manifest.json
          rm dist/geist-manifest-*.json
          cat dist/geist-manifest.json

      # Attach the built binaries to the existing Release release-plz created.
      # No generate_release_notes: release-plz already wrote the changelog notes.
      - name: Attach binaries to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: dist/*
