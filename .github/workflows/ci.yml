name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save Windows minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Pre-cloned ghostty source the native build script consumes, kept
      # outside target/ so it survives rust-cache's pruning. Uses
      # `github.workspace` (not `runner.temp`): the `runner` context is not
      # available in job-level `env`, only inside steps.
      GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/ghostty-src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The ghostty commit and the Zig version are pinned in the tree, not here:
      # a second copy in this file silently drifted out of sync once already and
      # cost a full Windows run to discover (the prefetched source was 876
      # commits behind the binding, so the build only failed at link time with
      # 37 unresolved ghostty_* externals). Read both from their one source of
      # truth instead. Later steps see these via the `env` context.
      - name: Resolve the pinned ghostty commit and Zig version
        shell: bash
        run: |
          set -euo pipefail
          commit=$(sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' \
            vendor/libghostty-rs/crates/libghostty-vt-sys/build.rs)
          zig=$(sed -n 's/^zig = "\([0-9][0-9.]*\)"$/\1/p' mise.toml)
          test -n "$commit" || { echo "::error::could not read GHOSTTY_COMMIT from build.rs"; exit 1; }
          test -n "$zig"    || { echo "::error::could not read the zig version from mise.toml"; exit 1; }
          echo "Ghostty $commit, Zig $zig"
          echo "GHOSTTY_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "ZIG_VERSION=$zig" >> "$GITHUB_ENV"

      # Exact Zig pin from mise.toml. Also caches the Zig global cache for us.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy

      # Cache the pinned ghostty source so we skip the ~100 MB clone on warm runs.
      - name: Cache ghostty source
        id: ghostty-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GHOSTTY_SOURCE_DIR }}
          key: ghostty-src-${{ env.GHOSTTY_COMMIT }}

      # On a cache miss, populate GHOSTTY_SOURCE_DIR ourselves; the build script
      # asserts $GHOSTTY_SOURCE_DIR/build.zig exists.
      - name: Fetch ghostty source (cache miss)
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ghostty-org/ghostty.git "$GHOSTTY_SOURCE_DIR"
          git -C "$GHOSTTY_SOURCE_DIR" checkout "$GHOSTTY_COMMIT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: zig${{ env.ZIG_VERSION }}-ghostty-${{ env.GHOSTTY_COMMIT }}

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
