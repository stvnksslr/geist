[package]
name = "giest"
version = "0.1.0"
edition = "2024"

[dependencies]
# Safe Rust bindings to libghostty-vt (Ghostty's VT engine). Vendored from
# Uzaaft/libghostty-rs @ 9bf2bd29 with a local patch: link the real static
# archive (ghostty-vt-static.lib) on Windows instead of the DLL import lib, so
# the binary doesn't depend on (and crash via) ghostty-vt.dll at runtime.
# The sys build.rs fetches the pinned ghostty commit and builds it with Zig 0.15.2.
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
anyhow = "1"
portable-pty = "0.9.0"
eframe = { version = "0.34.3", default-features = false, features = ["wgpu", "default_fonts"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
ab_glyph = "0.2.32"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
