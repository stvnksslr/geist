[package]
name = "giest"
version = "0.1.0"
edition = "2024"
publish = false # binary app with a vendored path dep — never goes to crates.io

[dependencies]
# Safe Rust bindings to libghostty-vt (Ghostty's VT engine). Vendored from
# Uzaaft/libghostty-rs @5988a0b, with Ghostty itself bumped to ghostty-org/ghostty main
# @b32f20f (regenerated bindings.rs + a render.rs fix — see CLAUDE.md). Needs Zig 0.16.0.
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
anyhow = "1"
portable-pty = "0.9.0"
eframe = { version = "0.34.3", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
ab_glyph = "0.2.32"
# Inline (small-string-optimized) string for per-cell grapheme clusters: stores
# up to 24 bytes inline, so the per-frame grid snapshot — built and cloned once
# per visible pane per frame — does no per-cell heap allocation in the common
# case. Derefs to &str, so read sites are unchanged.
compact_str = "0.8"
# The `link` config table (user regex link matchers). Already in the tree
# transitively; this only names it.
regex = "1"
# HarfBuzz-equivalent text shaper (pure Rust) for ligature/contextual-alternate
# substitution. We shape per-style cell runs and snap the resulting glyphs back
# onto the terminal grid by cluster.
rustybuzz = "0.20"
# Clipboard read for Ctrl+Shift+V paste (egui only emits a paste event for
# Ctrl+V; this lets us read the clipboard for the Ctrl+Shift+V binding too).
arboard = "3"
# Base64 for the kitty clipboard (OSC 5522) replay in clipboard.rs; also encode the
# PowerShell OSC 7 startup hook for `-EncodedCommand` (see profiles.rs).
base64 = "0.22"
# Percent-decode the OSC 7 working-directory URI a shell reports, so a new split
# can inherit the parent pane's directory (see session.rs::osc7_to_path).
percent-encoding = "2"
# Unicode display width (1 or 2 cells) for a grapheme cluster's leading char, so
# the renderer can size/centre wide glyphs (CJK, emoji) over their full cell span.
unicode-width = "0.2"
# PNG decoding for the kitty graphics protocol (`f=100`, what icat and most
# tools send). libghostty parses the protocol but leaves decoding to a hook that
# is unset by default; see src/engine/png_decode.rs.
png = "0.18"
# JPEG decoding for `background-image`. Ghostty accepts PNG *and* JPEG there, and
# `png` obviously cannot cover the second half; this is the same project
# (image-rs) and the same shape of pure-Rust decoder, so it adds a decoder rather
# than the whole `image` crate's format matrix. See src/bgimage.rs.
jpeg-decoder = "0.3"
# GLSL -> WGSL translation for `custom-shader` (Shadertoy-format shaders, which
# Ghostty also accepts). This is the *same* naga wgpu already vendors, so it
# dedupes; we take it as a direct dependency only to reach its GLSL frontend,
# which wgpu doesn't re-export. Deliberately routed through `wgsl-out` rather
# than handing wgpu a `naga::Module` directly: the text output keeps us
# independent of whatever naga version a future wgpu pins. See src/shader.rs.
naga = { version = "29", features = ["glsl-in", "wgsl-out"] }
# JSON-lines wire format for the single-instance IPC pipe (src/ipc.rs). Both
# are already in the dependency graph; the derive keeps the protocol types
# declarative instead of a hand-rolled parser free to drift from the docs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DWM window-composition APIs for `background-blur` (the Windows acrylic/mica
# backdrop; see src/blur.rs). Already in the tree via winit/wgpu, so this unifies
# with the existing pin rather than adding a build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",         # HRGN, a field of DWM_BLURBEHIND
    "Win32_System_LibraryLoader", # GetProcAddress: SetWindowCompositionAttribute
] }
# Name the window handle traits on eframe's CreationContext/Frame — eframe
# depends on raw-window-handle but does not re-export it.
raw-window-handle = "0.6"

# Vendored copy of egui-winit 0.34.3, depended on *specifically to apply one
# patch*: a transparent window on Windows also needs `WS_EX_NOREDIRECTIONBITMAP`,
# which upstream never sets. wgpu presents a transparent surface through
# DirectComposition with `CreateTargetForHwnd(hwnd, topmost = false)`, so its
# visual sits below the window's redirection surface — without the flag the
# window composites over that opaque surface and `background-opacity` renders as
# an opaque grey wash. The style is create-time only, so the app cannot add it
# later. giest doesn't depend on egui-winit directly (eframe does), hence a patch
# rather than a plain path dependency. Same shape as the libghostty-rs patch
# above; don't "simplify" it away. Re-apply on every egui upgrade.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
# Vendored only to expose PSEUDOCONSOLE_PASSTHROUGH_MODE (declared, never
# passed upstream); the delta is `set_passthrough`/`passthrough_active` and the
# flag + fallback in `src/win/psuedocon.rs`. Re-apply on a portable-pty bump.
portable-pty = { path = "vendor/portable-pty" }

# Writes the RT_GROUP_ICON resource into the exe so Explorer/Start/pinned
# shortcuts show the icon without running the process (see build.rs). Windows
# only, and build-time only — nothing links against it. Maintained fork of the
# unmaintained `winres`.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Statistical benchmark harness for the host CPU-path benches (see benches/).
criterion = "0.5"
# Block on wgpu's async adapter/device requests in the headless render bench
# (benches/render.rs). Already in the dependency tree via wgpu.
pollster = "0.4"

# Host-environment CPU-path benchmarks. They link the giest *library* (src/lib.rs)
# so they can drive the engine snapshot and the shaping path directly. Run with
# `cargo bench` (needs Zig 0.16.0 on PATH to build libghostty-vt).
[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "shaping"
harness = false

# VT-write throughput (Ghostty's TerminalStream/OscParser analog) + giest's own
# OSC side-scanners.
[[bench]]
name = "stream"
harness = false

# Renderer cost (glyph rasterization + per-frame instance assembly). Needs a
# headless wgpu device; skips gracefully when no GPU adapter is available.
[[bench]]
name = "render"
harness = false

# Maximally-optimized release build. Trades longer compile times for the fastest
# runtime — appropriate for a GPU terminal whose hot paths (VT parse, shaping,
# per-frame instance assembly) run thousands of times a second.
#
# NOTE: the vendored libghostty-vt Zig lib picks its own optimization from cargo's
# env in `libghostty-vt-sys/build.rs` — `cargo build --release` sets OPT_LEVEL=3 +
# DEBUG=false → Zig `ReleaseFast` (already maximal). Do NOT set `debug = true`
# here: that sets DEBUG=true and silently downgrades the Zig lib to a slow `Debug`
# build (see docs/benchmarking.md). Profile locally via `perf`/`samply` on a
# separate profiling profile instead.
[profile.release]
opt-level = 3        # max speed (default, made explicit)
lto = "fat"          # whole-program LTO across giest + all deps (incl. wgpu/eframe)
codegen-units = 1    # one unit → no cross-unit optimization barriers
panic = "abort"      # drop unwinding tables: smaller + lets the optimizer assume
                     # no unwind. A panic aborts the process (incl. the PTY reader
                     # thread) instead of unwinding — fine for a terminal, and
                     # safer across the libghostty-vt FFI boundary. `cargo
                     # test`/`bench` still build with unwind automatically.
strip = "symbols"    # strip symbols from the shipped binary (size only)

# Benchmarks inherit `release`, so the perf benches in `benches/` already measure
# this fully-optimized build. (Profile kept explicit for clarity.)
[profile.bench]
inherits = "release"
