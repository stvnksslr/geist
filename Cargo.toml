[package]
name = "giest"
version = "0.1.0"
edition = "2024"

[dependencies]
# Safe Rust bindings to libghostty-vt (Ghostty's VT engine). Vendored from
# Uzaaft/libghostty-rs @ 9bf2bd29 with a local patch: link the real static
# archive (ghostty-vt-static.lib) on Windows instead of the DLL import lib, so
# the binary doesn't depend on (and crash via) ghostty-vt.dll at runtime.
# The sys build.rs fetches the pinned ghostty commit and builds it with Zig 0.15.2.
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
anyhow = "1"
portable-pty = "0.9.0"
eframe = { version = "0.34.3", default-features = false, features = ["wgpu", "default_fonts"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
ab_glyph = "0.2.32"
# Inline (small-string-optimized) string for per-cell grapheme clusters: stores
# up to 24 bytes inline, so the per-frame grid snapshot — built and cloned once
# per visible pane per frame — does no per-cell heap allocation in the common
# case. Derefs to &str, so read sites are unchanged.
compact_str = "0.8"
# HarfBuzz-equivalent text shaper (pure Rust) for ligature/contextual-alternate
# substitution. We shape per-style cell runs and snap the resulting glyphs back
# onto the terminal grid by cluster.
rustybuzz = "0.20"
# Clipboard read for Ctrl+Shift+V paste (egui only emits a paste event for
# Ctrl+V; this lets us read the clipboard for the Ctrl+Shift+V binding too).
arboard = "3"
# Base64 decode for OSC 52 clipboard-set sequences; also base64-encode the
# PowerShell OSC 7 startup hook for `-EncodedCommand` (see profiles.rs).
base64 = "0.22"
# Percent-decode the OSC 7 working-directory URI a shell reports, so a new split
# can inherit the parent pane's directory (see session.rs::osc7_to_path).
percent-encoding = "2"
# Unicode display width (1 or 2 cells) for a grapheme cluster's leading char, so
# the renderer can size/centre wide glyphs (CJK, emoji) over their full cell span.
unicode-width = "0.2"

[dev-dependencies]
# Statistical benchmark harness for the host CPU-path benches (see benches/).
criterion = "0.5"
# Block on wgpu's async adapter/device requests in the headless render bench
# (benches/render.rs). Already in the dependency tree via wgpu.
pollster = "0.4"

# Host-environment CPU-path benchmarks. They link the giest *library* (src/lib.rs)
# so they can drive the engine snapshot and the shaping path directly. Run with
# `cargo bench` (needs Zig 0.15.2 on PATH to build libghostty-vt).
[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "shaping"
harness = false

# VT-write throughput (Ghostty's TerminalStream/OscParser analog) + giest's own
# OSC side-scanners.
[[bench]]
name = "stream"
harness = false

# Renderer cost (glyph rasterization + per-frame instance assembly). Needs a
# headless wgpu device; skips gracefully when no GPU adapter is available.
[[bench]]
name = "render"
harness = false

# Maximally-optimized release build. Trades longer compile times for the fastest
# runtime — appropriate for a GPU terminal whose hot paths (VT parse, shaping,
# per-frame instance assembly) run thousands of times a second.
#
# NOTE: the vendored libghostty-vt Zig lib picks its own optimization from cargo's
# env in `libghostty-vt-sys/build.rs` — `cargo build --release` sets OPT_LEVEL=3 +
# DEBUG=false → Zig `ReleaseFast` (already maximal). Do NOT set `debug = true`
# here: that sets DEBUG=true and silently downgrades the Zig lib to a slow `Debug`
# build (see docs/benchmarking.md). Profile locally via `perf`/`samply` on a
# separate profiling profile instead.
[profile.release]
opt-level = 3        # max speed (default, made explicit)
lto = "fat"          # whole-program LTO across giest + all deps (incl. wgpu/eframe)
codegen-units = 1    # one unit → no cross-unit optimization barriers
panic = "abort"      # drop unwinding tables: smaller + lets the optimizer assume
                     # no unwind. A panic aborts the process (incl. the PTY reader
                     # thread) instead of unwinding — fine for a terminal, and
                     # safer across the libghostty-vt FFI boundary. `cargo
                     # test`/`bench` still build with unwind automatically.
strip = "symbols"    # strip symbols from the shipped binary (size only)

# Benchmarks inherit `release`, so the perf benches in `benches/` already measure
# this fully-optimized build. (Profile kept explicit for clarity.)
[profile.bench]
inherits = "release"
